name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: euchre
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d euchre"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/euchre
      RUN_DB_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run assets:verify
      - run: bun run assets:cards
      - run: >-
          git diff --exit-code -- src/assets/cards &&
          test -z "$(git status --porcelain --untracked-files=all -- src/assets/cards)"
      - run: bun run db:migrate
      - run: bun run test
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run fmt:check
      - run: bun run build
