services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kitty
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - '55437:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d kitty']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
